<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <!-- Favicons -->
  <link href="assets/img/logo.png" rel="icon">
  <link href="assets/img/logo.png" rel="apple-touch-icon">
    <title>Login | Signup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="app.js"></script>
</head>
<body class="flex items-center justify-center h-screen bg-blue-50">
    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
        <div class="text-center mb-6">
            <img src="assets/img/DH.png" alt="Logo" class="mx-auto">
        </div>

        <!-- Auth Form -->
        <form id="auth-form">
            <div id="name-field" class="hidden mb-4">
                <label class="block text-gray-600 mb-1">Full Name</label>
                <input type="text" id="full-name" class="w-full p-2 border rounded-lg focus:ring focus:ring-blue-300">
            </div>

            <div class="mb-4">
                <label class="block text-gray-600 mb-1">Email</label>
                <input type="email" id="email" class="w-full p-2 border rounded-lg focus:ring focus:ring-blue-300">
            </div>

            <div class="mb-4">
                <label class="block text-gray-600 mb-1">Password</label>
                <input type="password" id="password" class="w-full p-2 border rounded-lg focus:ring focus:ring-blue-300">
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition">
                Sign In
            </button>
        </form>

        <p class="text-center mt-4 text-gray-600">
            New to Modernize? 
            <a href="#" id="toggle-link" class="text-blue-500 font-semibold">Create an account</a>
        </p>

        <p class="text-center mt-2">
            <a href="#" id="forgot-password" class="text-blue-500 text-sm">Forgot Password?</a>
        </p>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 space-y-2"></div>

</body>
</html>
